services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET in .env}
      PUSHER_APP_ID: ${PUSHER_APP_ID:?Set PUSHER_APP_ID in .env}
      PUSHER_KEY: ${PUSHER_KEY:?Set PUSHER_KEY in .env}
      PUSHER_SECRET: ${PUSHER_SECRET:?Set PUSHER_SECRET in .env}
      PUSHER_CLUSTER: ${PUSHER_CLUSTER:?Set PUSHER_CLUSTER in .env}
    restart: unless-stopped
    stop_grace_period: 30s

  migrate:
    profiles: [migrate]
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    restart: "no"
